<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script> 
    <title>Gestion Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex min-h-screen">
  
  <section class="flex flex-col items-center justify-start bg-zinc-800 p-8 w-72 gap-4">
    <button id="openForm" class="bg-blue-600 text-white font-bold px-6 py-3 rounded hover:bg-blue-700">
      Ajouter un employe
    </button>

    <div id="profileContainer" class="w-full flex flex-col gap-3"></div>
  </section>

 
  <section class="workspace relative flex-1">
    <img src="plan.jpg" 
         class="min-h-screen w-full object-cover" alt="Office Plan" />

    <div class="chambers absolute top-0 left-0 w-full h-full">
      <div class="conference bg-green-600/50 flex justify-center items-center relative" data-room="conference">
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 z-10">+</button>
        <div class="badges-container"></div>
      </div>
      
      <div class="serveurs bg-yellow-600/50 flex justify-center items-center relative" data-room="serveurs">
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 z-10">+</button>
        <div class="badges-container"></div>
      </div>
      
      <div class="security bg-red-600/50 flex justify-center items-center relative" data-room="security">
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 z-10">+</button>
        <div class="badges-container"></div>
      </div>
      
      <div class="reception bg-blue-600/50 flex justify-center items-center relative" data-room="reception">
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 z-10">+</button>
        <div class="badges-container"></div>
      </div>
      
      <div class="personel bg-green-600/50 flex justify-center items-center relative" data-room="personel">
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 z-10">+</button>
        <div class="badges-container"></div>
      </div>
      
      <div class="archive bg-gray-600/50 flex justify-center items-center relative" data-room="archive">
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 z-10">+</button>
        <div class="badges-container"></div>
      </div>
    </div>
  </section>

  
  <div id="popup" class="hidden fixed inset-0 bg-black/60 flex justify-center items-center z-50">
    <form class="bg-zinc-700 rounded-lg shadow-xl p-8 w-96 max-h-[600px] overflow-auto">
      <h2 class="text-white text-2xl font-bold mb-6 text-center">Ajouter un employé</h2>

      <div class="mb-4">
        <label class="block text-white mb-1">Nom complet</label>
        <input class="w-full px-4 py-2 rounded bg-zinc-600 text-white" id="name" type="text" required />
      </div>

      <div class="mb-6">
        <label class="block text-white mb-1">Rôle</label>
        <select class="w-full px-4 py-2 rounded bg-zinc-600 text-white" id="room" required>
          <option value="">Choisir un rôle</option>
          <option value="Receptionnistes">Réceptionnistes</option>
          <option value="Techniciens">Techniciens</option>
          <option value="securite">Sécurité</option>
          <option value="Manager">Manager</option>
          <option value="Nettoyage">Nettoyage</option>
          <option value="invite">Invité</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-white mb-1">Image URL</label>
        <input class="w-full px-4 py-2 rounded bg-zinc-600 text-white" id="pic" type="text" 
               placeholder="https://..." />
      </div>

      <div class="mb-4">
        <label class="block text-white mb-1">Email</label>
        <input class="w-full px-4 py-2 rounded bg-zinc-600 text-white" id="email" type="email" />
      </div>

      <div class="mb-6">
        <label class="block text-white mb-1">Téléphone</label>
        <input class="w-full px-4 py-2 rounded bg-zinc-600 text-white" id="tele" type="tel" />
      </div>

      <div class="mb-6">
        <label class="block text-white mb-1">Expériences</label>
        <div id="experienceList" class="flex flex-col gap-4"></div>
        <button type="button" id="addExperience"
          class="mt-3 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
          + Ajouter une expérience
        </button>
      </div>

      <div class="flex gap-3">
        <button type="button" id="closeForm"
          class="w-1/2 bg-red-600 hover:bg-red-700 text-white py-2 rounded">Fermer</button>
        <button type="submit"
          class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">Ajouter</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
